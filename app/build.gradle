plugins {
    id 'com.android.application'
}

// Release signing — reads keystore.properties (gitignored). If absent, the
// release build falls back to unsigned (debug still works without it).
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) { keystoreProps.load(new FileInputStream(keystorePropsFile)) }

android {
    namespace 'com.adbhide'
    // Java-only LSPosed module. No native lib, no assets/native_init — so LSPosed
    // never sets up a native bridge and nothing is injected into any target app.
    // The single job: a pure Xposed Java hook on SettingsProvider inside
    // system_server that returns adb_enabled/development_settings_enabled = 0 to
    // app callers, keeping the real value for system/adbd (adb stays working).
    compileSdk 33

    defaultConfig {
        applicationId 'com.adbhide'
        minSdk 26
        targetSdk 33
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
}

dependencies {
    compileOnly fileTree(dir: 'libs', include: ['*.jar'])
}
